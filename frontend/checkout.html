<div class="modal" id="checkoutModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeCheckout()">✕</button>
        <h2>📦 অর্ডার তথ্য দিন</h2>
        <form id="checkoutForm" onsubmit="placeOrder(event)">
            <div class="form-group">
                <label>আপনার নাম *</label>
                <input type="text" id="custName" required placeholder="যেমন: রহিম মিয়া">
            </div>
            <div class="form-group">
                <label>মোবাইল *</label>
                <input type="tel" id="custPhone" required placeholder="01XXXXXXXXX">
            </div>
            <div class="form-group">
                <label>ঠিকানা *</label>
                <textarea id="custAddress" required rows="3" placeholder="গ্রাম/শহর, থানা, জেলা"></textarea>
            </div>
            <div class="form-group">
                <label>নোট (অপশনাল)</label>
                <textarea id="custNote" rows="2" placeholder="বিশেষ কোনো নির্দেশনা..."></textarea>
            </div>

            <!-- Payment Method -->
            <div class="form-group">
                <label>পেমেন্ট পদ্ধতি *</label>
                <select id="paymentMethod" onchange="togglePaymentInfo()" style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;">
                    <option value="cod">💵 ক্যাশ অন ডেলিভারি</option>
                    <option value="bkash">📱 বিকাশ</option>
                    <option value="nagad">📱 নগদ</option>
                </select>
            </div>

            <!-- Payment Info (bKash/Nagad) -->
            <div id="paymentInfo" style="display:none;background:#fef5e7;padding:15px;border-radius:10px;margin-bottom:15px;">
                <div style="font-weight:600;color:#c05621;margin-bottom:8px;">
                    💰 টাকা পাঠান এই নম্বরে:
                </div>
                <div style="font-size:1.3rem;font-weight:bold;color:#ed8936;letter-spacing:1px;margin-bottom:10px;" id="paymentNumber">
                    01711-XXXXXX
                </div>
                <p style="font-size:0.85rem;color:#718096;margin-bottom:12px;">
                    উপরের নম্বরে <b>Send Money</b> করুন, তারপর নিচের তথ্য দিন:
                </p>
                <div class="form-group">
                    <label>ট্রানজেকশন আইডি (TrxID) *</label>
                    <input type="text" id="custTrxId" placeholder="যেমন: 8N7A2B4C9D">
                </div>
                <div class="form-group">
                    <label>যে নম্বর থেকে পাঠিয়েছেন *</label>
                    <input type="tel" id="custSenderNumber" placeholder="01XXXXXXXXX">
                </div>
            </div>

            <div class="cart-total" style="margin-top:15px;">
                <span>সর্বমোট:</span>
                <span id="checkoutTotal">৳0</span>
            </div>
            <button type="submit" class="submit-btn">🎉 অর্ডার কনফার্ম করুন</button>
        </form>
    </div>
</div>
